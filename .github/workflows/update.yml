name: Update Dashboard

on:
  schedule:
    - cron: '0 6 * * *'   # каждый день в 9:00 МСК (6:00 UTC)
    - cron: '0 16 * * *'  # каждый день в 19:00 МСК (16:00 UTC)
  workflow_dispatch:       # кнопка ручного запуска на GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Update dashboard
        run: python3 update.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json dashboard.html pipeline.html index.html landing.html
          git diff --staged --quiet || git commit -m "auto-update $(date -u +%Y-%m-%d)"
          git push
