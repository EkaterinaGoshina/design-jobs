  .filters-toggle {
    display: none;
    width: 100%; padding: 14px 16px;

    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 12px 16px 14px; align-items: center;
  }
  .filters .label {
    font-size: 11px; text-transform: uppercase; color: #8e8e93;
    margin-right: 4px; letter-spacing: 0.5px;
  }
  #search {
    padding: 8px 12px; border: 1px solid #d0d0d5; border-radius: 10px;
    font-size: 15px; flex: 1; min-width: 180px; background: #f5f5f7;
    -webkit-appearance: none;

  .chip {
    padding: 6px 13px; background: #f5f5f7; border: 1px solid transparent;
    border-radius: 999px; cursor: pointer; font-size: 13px;
    user-select: none; transition: all 0.1s; white-space: nowrap;
  }
  .chip:hover { border-color: #8e8e93; }
  .chip.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; }
  .stats { font-size: 13px; color: #6e6e73; padding: 6px 2px 10px; }

  /* Сетка карточек */
  #list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    align-items: start;
  }
  @media (max-width: 900px) { #list { grid-template-columns: repeat(2, 1fr); } }

  .btn {

  (function markFresh() {
    const bySrc = {};
    JOBS.forEach(j => { (bySrc[j.s] = bySrc[j.s] || []).push(j); });
    Object.values(bySrc).forEach(arr => {
      arr.sort((a,b) => (b.pid || 0) - (a.pid || 0));
      arr.slice(0, 3).forEach(j => j.fresh = true);
    });
  })();

  const STORE_STATUS = 'designJobs.status.v1';
  const STORE_HIDDEN_LEGACY = 'designJobs.hidden.v2';
  const STORE_FILTERS = 'designJobs.filters.v2';

  const state = { statuses: loadStatuses() };

  function loadStatuses() {
    let statuses = {};
    try { statuses = JSON.parse(localStorage.getItem(STORE_STATUS) || '{}'); } catch (e) {}
    try {
      const oldHidden = JSON.parse(localStorage.getItem(STORE_HIDDEN_LEGACY) || '[]');
      oldHidden.forEach(url => { if (!statuses[url]) statuses[url] = 'skip'; });
      if (oldHidden.length) {
        localStorage.setItem(STORE_STATUS, JSON.stringify(statuses));
        localStorage.removeItem(STORE_HIDDEN_LEGACY);
      }
    } catch (e) {}
    return statuses;
  }

  function saveStatuses() {
    localStorage.setItem(STORE_STATUS, JSON.stringify(state.statuses));
  }

  function setStatus(url, newStatus) {
    if (state.statuses[url] === newStatus) delete state.statuses[url];
    else state.statuses[url] = newStatus;
    saveStatuses();
    render();
  }

  function saveFilters() {
    localStorage.setItem(STORE_FILTERS, JSON.stringify({
      role: getActiveSet('.role-filter', 'data-role'),
      level: getActiveSet('.level-filter', 'data-level'),
      format: getActiveSet('.format-filter', 'data-format'),
    }));
  }

  function loadFilters() {
    try { return JSON.parse(localStorage.getItem(STORE_FILTERS)); } catch (e) { return null; }
  }

  function getActiveSet(sel, attr) {
    return Array.from(document.querySelectorAll(sel + '.active')).map(el => el.getAttribute(attr));
  }

  function getJobStatus(j) { return state.statuses[j.url] || null; }

  function applyFilters() {
    const search = document.getElementById('search').value.trim().toLowerCase();
    const roles = getActiveSet('.role-filter', 'data-role');
    const levels = getActiveSet('.level-filter', 'data-level');
    const formats = getActiveSet('.format-filter', 'data-format');
    const statusChips = getActiveSet('.status-filter', 'data-status');

    let visible = JOBS.filter(j => roles.includes(j.role));
    visible = visible.filter(j => levels.includes(j.lvl));
    visible = visible.filter(j => formats.includes(j.fmt));
    visible = visible.filter(j => statusChips.includes(getJobStatus(j) || 'new'));

    if (search) {
      visible = visible.filter(j => {
        const h = (j.t + ' ' + j.c + ' ' + (j.sal || '') + ' ' + (j.note || '') + ' ' + j.s).toLowerCase();
        return h.includes(search);
      });
    }
    return visible;
  }

  function render() {
    const list = document.getElementById('list');
    const visible = applyFilters();

    const appliedCount = Object.values(state.statuses).filter(s => s === 'applied').length;
    const viewedCount = Object.values(state.statuses).filter(s => s === 'viewed').length;
    const skipCount = Object.values(state.statuses).filter(s => s === 'skip').length;

    let statsStr = 'Показано: ' + visible.length + ' из ' + JOBS.length;
    if (appliedCount) statsStr += '  ·  ✅ откликнулась: ' + appliedCount;
    if (viewedCount) statsStr += '  ·  👀 просмотрела: ' + viewedCount;
    if (skipCount) statsStr += '  ·  ✖ не интересует: ' + skipCount;
    document.getElementById('counter').textContent = statsStr;

    if (visible.length === 0) {
      list.innerHTML = '<div class="empty">Ничего не найдено по выбранным фильтрам.<br>Попробуй включить другие грейды или роли.</div>';
      return;
    }

    list.innerHTML = visible.map(renderCard).join('');
    list.querySelectorAll('.card').forEach(card => {
      const url = card.dataset.url;
      card.querySelectorAll('.btn-status').forEach(btn => {
        btn.addEventListener('click', () => setStatus(url, btn.dataset.status));
      });
    });
  }

  function renderCard(j) {
    const status = getJobStatus(j);
    let cardClass = 'card';
    if (status === 'viewed') cardClass += ' status-viewed';
    if (status === 'applied') cardClass += ' status-applied';
    if (status === 'skip') cardClass += ' status-skip';

    const tags = ['<span class="tag source">' + esc(j.s) + '</span>'];
    if (j.fresh) tags.push('<span class="tag fresh">свежее</span>');
    if (j.lvl !== 'unknown') tags.push('<span class="tag level-' + j.lvl + '">' + j.lvl + '</span>');
    if (j.fmt !== 'unknown') tags.push('<span class="tag format-' + j.fmt + '">' + fmtLabel(j.fmt) + '</span>');
    tags.push('<span class="tag role">' + roleLabel(j.role) + '</span>');

    let badge = '';
    if (status === 'viewed') badge = '<span class="status-badge viewed">👀 Просмотрела</span>';
    if (status === 'applied') badge = '<span class="status-badge applied">✅ Откликнулась</span>';

    let pubLine = '';
    if (j.s === 'HireHi') pubLine = 'Из текущей ленты HireHi (id #' + j.pid + ')';
    else if (j.time) pubLine = 'Опубликовано в ' + esc(j.time) + ' · пост #' + j.pid + ' в @' + j.s;
    else if (j.pid) pubLine = 'Пост #' + j.pid + ' в @' + j.s;

    const btnViewed = '<button class="btn btn-status' + (status === 'viewed' ? ' active-viewed' : '') + '" data-status="viewed">👀 Просмотрела</button>';
    const btnApplied = '<button class="btn btn-status' + (status === 'applied' ? ' active-applied' : '') + '" data-status="applied">✅ Откликнулась</button>';
    const btnSkip = '<button class="btn btn-status btn-link' + (status === 'skip' ? ' active-skip' : '') + '" data-status="skip">✖ Не интересует</button>';

    return '' +
      '<div class="' + cardClass + '" data-url="' + escAttr(j.url) + '">' +
        '<div class="card-head">' +
          '<div class="card-title">' + esc(j.t) +
            (j.c ? ' <span style="color:#8e8e93;font-weight:400;">· ' + esc(j.c) + '</span>' : '') +
          '</div>' +
          badge +
        '</div>' +
        '<div class="card-tags">' + tags.join('') + '</div>' +
        (j.sal ? '<div class="card-desc">' + esc(j.sal) + (j.note ? ' · <i>' + esc(j.note) + '</i>' : '') + '</div>' : '') +
        (pubLine ? '<div class="pub">' + pubLine + '</div>' : '') +
        '<div class="card-actions">' +
          '<a class="btn btn-primary" href="' + escAttr(j.url) + '" target="_blank" rel="noopener">Открыть ↗</a>' +
          btnViewed + btnApplied + btnSkip +
        '</div>' +
      '</div>';
  }

  function fmtLabel(f) { return { remote: 'удалёнка', hybrid: 'гибрид', office: 'офис' }[f] || f; }
  function roleLabel(r) { return { product: 'продуктовый', ux: 'ux/ui', web: 'веб', other: 'дизайн' }[r] || r; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }

  function setupChips() {
    // Кнопка раскрытия фильтров на мобильном
    const toggle = document.getElementById('filtersToggle');
    const body = document.getElementById('filtersBody');
    if (toggle) {
      toggle.addEventListener('click', () => {
        const open = body.classList.toggle('open');
        toggle.classList.toggle('open', open);
      });
    }

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        chip.classList.toggle('active'); saveFilters(); render();
      });
    });
    document.getElementById('search').addEventListener('input', () => render());
    const f = loadFilters();
    if (f) {
      const restore = (sel, attr, set) => {
        document.querySelectorAll(sel).forEach(el => {
          el.classList.toggle('active', (set || []).includes(el.getAttribute(attr)));
        });
      };
      if (f.role) restore('.role-filter', 'data-role', f.role);
      if (f.level) restore('.level-filter', 'data-level', f.level);
      if (f.format) restore('.format-filter', 'data-format', f.format);
    }
  }

  const counts = {};
  JOBS.forEach(j => { counts[j.s] = (counts[j.s] || 0) + 1; });
  const srcStr = Object.entries(counts).map(([k,v]) => k + ' (' + v + ')').join(' · ');
  document.getElementById('meta').textContent =
    'Снимок: ' + SNAPSHOT_DATE + ' · ' + JOBS.length + ' вакансий · ' + srcStr +
    ' · топ-3 в каждом источнике помечены «свежее»';

  setupChips();
  render();
})();
</script>
